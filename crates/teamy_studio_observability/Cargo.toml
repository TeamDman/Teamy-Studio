[package]
name = "teamy_studio_observability"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = "0.4"
eyre = "0.6.12"
teamy_studio_logs = { path = "../teamy_studio_logs" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tracing-tracy = { version = "0.11", optional = true }

[dev-dependencies]
tempfile = "3.20.0"

[features]
default = []
tracy = ["dep:tracing-tracy"]