[workspace]
resolver = "3"
members = [
	"crates/teamy_studio_fonts",
	"crates/teamy_studio_event_core",
	"crates/teamy_studio_registration_core",
	"crates/teamy_studio_timeline_core",
	"crates/teamy_studio_shell",
	"crates/teamy_studio_main_menu",
	"crates/teamy_studio_launcher_catalog",
	"crates/teamy_studio_cursor_gallery",
]

[package]
name = "teamy-studio"
version = "0.1.0"
edition = "2024"
authors = ["TeamDman"]
default-run = "teamy-studio"
# repo[impl description.meaningful]
description = "Teamy Studio desktop shell with a low-latency Win32 startup path"
# repo[impl license.present]
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/TeamDman/Teamy-Studio"
keywords = ["windows", "desktop", "studio"]
categories = ["command-line-utilities"]
documentation = "https://github.com/TeamDman/Teamy-Studio"

[profile.dev]
debug = "full"

[[bin]]
name = "teamy-studio"
path = "src/main.rs"

[dependencies]
eyre = "0.6.12"
teamy_studio_cursor_gallery = { path = "crates/teamy_studio_cursor_gallery", optional = true }
teamy_studio_event_core = { path = "crates/teamy_studio_event_core", optional = true }
teamy_studio_launcher_catalog = { path = "crates/teamy_studio_launcher_catalog", optional = true }
teamy_studio_main_menu = { path = "crates/teamy_studio_main_menu", optional = true }
teamy_studio_registration_core = { path = "crates/teamy_studio_registration_core", optional = true }
teamy_studio_shell = { path = "crates/teamy_studio_shell", optional = true }
teamy_studio_timeline_core = { path = "crates/teamy_studio_timeline_core", optional = true }

[features]
default = ["mvp"]
font-snapshot-tests = []
ghostty = []
mvp = [
	"dep:teamy_studio_cursor_gallery",
	"dep:teamy_studio_event_core",
	"dep:teamy_studio_launcher_catalog",
	"dep:teamy_studio_main_menu",
	"dep:teamy_studio_registration_core",
	"dep:teamy_studio_shell",
	"dep:teamy_studio_timeline_core",
]
tracy = []

[build-dependencies]
embed-resource = "3.0.6"

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
multiple_crate_versions = "allow" # turn this off periodically to see how bad it has gotten :P
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives
multiple_unsafe_ops_per_block = "deny"
module_inception = "allow"
allow_attributes = "deny"
# allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "allow" # facet macros use Unicode identifiers
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
