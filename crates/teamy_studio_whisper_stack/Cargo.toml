[package]
name = "teamy_studio_whisper_stack"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
burn = { version = "0.19.0", default-features = false, features = ["cuda", "ndarray", "std", "store", "record-item-custom-serde"] }
burn-store = "0.19.1"
dunce = "1.0.5"
eyre = "0.6.12"
hound = "3.5.1"
npy = "0.4.0"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
teamy_studio_audio_core = { path = "../teamy_studio_audio_core" }
teamy_studio_frontend = { path = "../teamy_studio_frontend" }
teamy_studio_paths = { path = "../teamy_studio_paths" }
tokenizers = { version = "0.22.0", default-features = false, features = ["onig"] }
tracing = "0.1.41"
walkdir = "2.5.0"
zip = { version = "2.4.1", default-features = false, features = ["deflate"] }

[features]
default = []
extended_observability = []
