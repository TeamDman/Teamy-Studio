[project]
name = "teamy-waifu2x-reference"
version = "0.1.0"
description = "Teamy Studio waifu2x reference harness for Rust/Burn port validation"
requires-python = ">=3.11"
dependencies = [
    "filelock",
    "numpy",
    "packaging",
    "pillow",
    "platformdirs",
    "pyyaml",
    "requests",
    "scipy",
    "torch",
    "torchvision",
    "tqdm",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
teamy-waifu2x-reference = "teamy_waifu2x_reference.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"