[project]
name = "teamy-llm-reference"
version = "0.1.0"
description = "Teamy Studio LLM reference harness for Rust GGUF port validation"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
teamy-llm-reference = "teamy_llm_reference.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
