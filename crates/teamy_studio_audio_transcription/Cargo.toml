[package]
name = "teamy_studio_audio_transcription"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
eyre.workspace = true
facet.workspace = true
facet-json.workspace = true
teamy_studio_paths.workspace = true
teamy_studio_win32_support.workspace = true
tokio.workspace = true
tracing = { workspace = true, optional = true }
windows = { workspace = true, features = [
    "std",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
] }

[features]
default = []
extended_observability = ["dep:tracing"]
