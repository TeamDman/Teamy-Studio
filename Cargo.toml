[workspace]
resolver = "3"
members = [
    "crates/teamy_studio_audio_core",
    "crates/teamy_studio_app_host",
    "crates/teamy_studio_audio_input",
    "crates/teamy_studio_audio_transcription",
	"crates/teamy_studio_cli",
    "crates/teamy_studio_cursor_info",
    "crates/teamy_studio_demo_mode",
    "crates/teamy_studio_frontend",
    "crates/teamy_studio_image_models",
    "crates/teamy_studio_llm_stack",
    "crates/teamy_studio_jobs",
    "crates/teamy_studio_logs",
	"crates/teamy_studio_observability",
    "crates/teamy_studio_paths",
    "crates/teamy_studio_shell",
    "crates/teamy_studio_shell_default",
    "crates/teamy_studio_spatial",
    "crates/teamy_studio_teamy_terminal_engine",
    "crates/teamy_studio_terminal_core",
    "crates/teamy_studio_timeline_core",
    "crates/teamy_studio_vt_types",
    "crates/teamy_studio_waifu2x_reference",
    "crates/teamy_studio_whisper_stack",
    "crates/teamy_studio_windows_audio",
    "crates/teamy_studio_windows_dialogs",
    "crates/teamy_studio_windows_terminal_replay",
    "crates/teamy_studio_win32_support",
]

[workspace.dependencies]
teamy_studio_audio_core = { path = "crates/teamy_studio_audio_core" }
teamy_studio_app_host = { path = "crates/teamy_studio_app_host" }
teamy_studio_audio_input = { path = "crates/teamy_studio_audio_input" }
teamy_studio_audio_transcription = { path = "crates/teamy_studio_audio_transcription" }
teamy_studio_cli = { path = "crates/teamy_studio_cli" }
teamy_studio_cursor_info = { path = "crates/teamy_studio_cursor_info" }
teamy_studio_demo_mode = { path = "crates/teamy_studio_demo_mode" }
teamy_studio_frontend = { path = "crates/teamy_studio_frontend" }
teamy_studio_image_models = { path = "crates/teamy_studio_image_models" }
teamy_studio_llm_stack = { path = "crates/teamy_studio_llm_stack" }
teamy_studio_jobs = { path = "crates/teamy_studio_jobs" }
teamy_studio_logs = { path = "crates/teamy_studio_logs" }
teamy_studio_observability = { path = "crates/teamy_studio_observability" }
teamy_studio_paths = { path = "crates/teamy_studio_paths" }
teamy_studio_shell = { path = "crates/teamy_studio_shell" }
teamy_studio_shell_default = { path = "crates/teamy_studio_shell_default" }
teamy_studio_spatial = { path = "crates/teamy_studio_spatial" }
teamy_studio_teamy_terminal_engine = { path = "crates/teamy_studio_teamy_terminal_engine" }
teamy_studio_terminal_core = { path = "crates/teamy_studio_terminal_core" }
teamy_studio_timeline_core = { path = "crates/teamy_studio_timeline_core" }
teamy_studio_vt_types = { path = "crates/teamy_studio_vt_types" }
teamy_studio_waifu2x_reference = { path = "crates/teamy_studio_waifu2x_reference" }
teamy_studio_whisper_stack = { path = "crates/teamy_studio_whisper_stack" }
teamy_studio_windows_audio = { path = "crates/teamy_studio_windows_audio" }
teamy_studio_windows_dialogs = { path = "crates/teamy_studio_windows_dialogs" }
teamy_studio_windows_terminal_replay = { path = "crates/teamy_studio_windows_terminal_replay" }
teamy_studio_win32_support = { path = "crates/teamy_studio_win32_support" }

arbitrary = { version = "1.4.1", features = ["derive"] }
burn = { version = "0.21.0", default-features = false, features = ["cuda", "ndarray", "std", "store", "record-item-custom-serde"] }
burn-store = "0.21.0"
chrono = "0.4"
color-eyre = "0.6.5"
crossterm = "0.29"
directories-next = "2"
dunce = "1.0.5"
eyre = "0.6.12"
facet = "=0.46.5"
facet-csv = "=0.46.1"
facet-json = "=0.46.1"
facet-pretty = "=0.46.5"
figue = { package = "teamy-figue", version = "=4.0.3", features = ["arbitrary"] }
fontdb = "0.23"
fontdue = "0.9.3"
hound = "3.5.1"
half = "2.7.1"
humantime = "2.2.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
npy = "0.4.0"
open = "5"
portable-pty = "0.9"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = "0.15"
rustfft = "6.4.1"
safetensors = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sguaba = { version = "0.10.3", default-features = false, features = ["std"] }
memmap2 = "0.9.9"
tempfile = "3.20.0"
tokio = { version = "1.49.0", features = ["full"] }
tokenizers = { version = "0.22.0", default-features = false, features = ["onig"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tracing-tracy = "0.11"
tracy-client = "0.18.4"
ttf-parser = "0.25"
uom = { version = "0.38.0", default-features = false, features = ["autoconvert", "f64", "si", "std"] }
widestring = "1.2"
walkdir = "2.5.0"
windows = { version = "0.62.2", default-features = false }
zip = { version = "2.4.1", default-features = false, features = ["deflate"] }

[package]
name = "teamy-studio"
version = "0.1.0"
edition = "2024"
authors = ["TeamDman"]
default-run = "teamy-studio"
# repo[impl description.meaningful]
description = "Teamy Studio desktop shell with a low-latency Win32 startup path"
# repo[impl license.present]
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/TeamDman/Teamy-Studio"
keywords = ["windows", "desktop", "studio"]
categories = ["command-line-utilities"]
documentation = "https://github.com/TeamDman/Teamy-Studio"

[profile.dev]
debug = "full"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.teamy-studio]
opt-level = 1

[profile.dev.package.teamy_studio_cli]
opt-level = 1

[profile.dev.package.teamy_studio_llm_stack]
opt-level = 1

[profile.profiling]
inherits = "release"
incremental = true

[profile.profiling.package.teamy_studio_cli]
opt-level = 1
codegen-units = 256

[[bin]]
name = "teamy-studio"
path = "src/main.rs"

[dependencies]
arbitrary.workspace = true
burn.workspace = true
burn-store.workspace = true
chrono.workspace = true
color-eyre.workspace = true
teamy_studio_audio_core.workspace = true
teamy_studio_app_host.workspace = true
teamy_studio_audio_input.workspace = true
teamy_studio_audio_transcription.workspace = true
teamy_studio_cli.workspace = true
teamy_studio_cursor_info.workspace = true
teamy_studio_demo_mode.workspace = true
teamy_studio_frontend.workspace = true
teamy_studio_image_models.workspace = true
teamy_studio_llm_stack.workspace = true
teamy_studio_jobs.workspace = true
teamy_studio_logs.workspace = true
teamy_studio_observability.workspace = true
teamy_studio_paths.workspace = true
teamy_studio_shell.workspace = true
teamy_studio_shell_default.workspace = true
teamy_studio_spatial.workspace = true
teamy_studio_teamy_terminal_engine.workspace = true
teamy_studio_terminal_core.workspace = true
teamy_studio_timeline_core.workspace = true
teamy_studio_vt_types.workspace = true
teamy_studio_waifu2x_reference.workspace = true
teamy_studio_whisper_stack.workspace = true
teamy_studio_windows_audio.workspace = true
teamy_studio_windows_dialogs.workspace = true
teamy_studio_windows_terminal_replay.workspace = true
teamy_studio_win32_support.workspace = true
dunce.workspace = true
eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracy-client = { workspace = true, optional = true }
image.workspace = true
directories-next.workspace = true
hound.workspace = true
npy.workspace = true
tokio.workspace = true
facet.workspace = true
facet-csv.workspace = true
facet-json.workspace = true
facet-pretty.workspace = true
figue.workspace = true
open.workspace = true
reqwest.workspace = true
rfd.workspace = true
crossterm.workspace = true
fontdb.workspace = true
portable-pty.workspace = true
ratatui.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
sguaba.workspace = true
tokenizers.workspace = true
ttf-parser.workspace = true
uom.workspace = true
widestring.workspace = true
walkdir.workspace = true
zip.workspace = true
windows = { workspace = true, features = [
	"std",
	"Win32_Foundation",
	"Win32_Devices_Properties",
	"Win32_Globalization",
	"Win32_Graphics_Direct3D",
	"Win32_Graphics_Direct3D_Fxc",
	"Win32_Graphics_Direct3D12",
	"Win32_Graphics_DirectComposition",
	"Win32_Graphics_Dwm",
	"Win32_Graphics_Dxgi",
	"Win32_Graphics_Dxgi_Common",
	"Win32_Graphics_Gdi",
	"Win32_Media_Audio",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Console",
	"Win32_System_DataExchange",
	"Win32_System_Diagnostics_Debug",
	"Win32_System_LibraryLoader",
	"Win32_System_Memory",
	"Win32_System_Ole",
	"Win32_Security",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_UI_Controls",
	"Win32_UI_HiDpi",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell",
	"Win32_UI_Shell_PropertiesSystem",
	"Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
fontdue.workspace = true
tempfile.workspace = true

[features]
default = ["extended_observability"]
font-snapshot-tests = []
extended_observability = ["teamy_studio_app_host/extended_observability", "teamy_studio_audio_input/extended_observability", "teamy_studio_audio_transcription/extended_observability", "teamy_studio_cli/extended_observability", "teamy_studio_frontend/extended_observability", "teamy_studio_observability/extended_observability", "teamy_studio_shell/extended_observability", "teamy_studio_teamy_terminal_engine/extended_observability", "teamy_studio_terminal_core/extended_observability", "teamy_studio_whisper_stack/extended_observability"]
tracing_subscriber_tracy = ["teamy_studio_llm_stack/tracing_subscriber_tracy", "teamy_studio_observability/tracing_subscriber_tracy", "dep:tracy-client"]

[build-dependencies]
embed-resource = "3.0.6"

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
multiple_crate_versions = "allow" # turn this off periodically to see how bad it has gotten :P
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives
multiple_unsafe_ops_per_block = "deny"
module_inception = "allow"
allow_attributes = "deny"
# allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "allow" # facet macros use Unicode identifiers
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
