[package]
name = "teamy_studio_terminal_core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
eyre.workspace = true
facet.workspace = true
portable-pty.workspace = true
teamy_studio_paths.workspace = true
teamy_studio_shell_default.workspace = true
teamy_studio_spatial.workspace = true
teamy_studio_teamy_terminal_engine.workspace = true
teamy_studio_vt_types.workspace = true
teamy_studio_windows_audio.workspace = true
teamy_studio_windows_terminal_engine = { workspace = true, optional = true }
tracing.workspace = true
libghostty-vt = { workspace = true, optional = true }
windows = { workspace = true, features = [
    "std",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
ghostty = [
    "dep:libghostty-vt",
    "dep:teamy_studio_windows_terminal_engine",
    "teamy_studio_vt_types/ghostty",
    "teamy_studio_windows_terminal_engine/ghostty",
]
extended_observability = []
